# Keeps this repository in step with the project on GitLab, which is the one where the work is done:
# https://gitlab.dei.unipd.it/Antonio-Prado/aspa-explorer. It runs on GitHub only (GitLab ignores the file).
# The main branch and the tags are copied as they are, and a release is made for the latest tags. When the main
# branch has changed, the accessibility check (scripts/test-a11y.mjs, Chromium and axe-core) runs on the copy: the
# runner of the GitLab project is a FreeBSD shell executor, where Playwright does not run.
# Do not edit this file on GitHub: the next run would overwrite it. A change to it has to come from GitLab,
# and the first push of a changed workflow has to be made by hand, because the token of a run may not change workflows.
name: Mirror

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository_owner == 'Antonio-Prado'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.copy.outputs.changed }}
    steps:
      - name: Copy main and the tags from GitLab
        id: copy
        run: |
          set -eu
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          before=$(git ls-remote origin refs/heads/main | cut -f1)
          git fetch --quiet https://gitlab.dei.unipd.it/Antonio-Prado/aspa-explorer.git '+refs/heads/main:refs/heads/main' '+refs/tags/*:refs/tags/*'
          if [ "$before" != "$(git rev-parse refs/heads/main)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git push --force --quiet origin refs/heads/main:refs/heads/main
          git push --force --quiet origin 'refs/tags/*:refs/tags/*'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Make a release for each of the latest tags
        run: |
          set -eu
          for tag in $(git tag --list 'v*' --sort=-v:refname | head -n 5 | sort -V); do
            gh release view "$tag" >/dev/null 2>&1 && continue
            version="${tag#v}"
            git show "$tag:CHANGELOG.md" | awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  accessibility:
    needs: mirror
    if: needs.mirror.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.49.1 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-a11y.mjs
