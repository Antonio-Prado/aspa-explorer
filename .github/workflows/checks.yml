# The checks of `make check` (JavaScript syntax, HTML validation, the OpenAPI schema, the version, the security lint of the browser code and the unit tests) on each
# push to the main branch and on each pull request. The check of the nginx configuration is left out: the nginx of the runner is too old for
# the configuration of the site (`http2 on;`), and the pipeline of the GitLab project runs it. This is for the people who send a pull request.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository_owner == 'Antonio-Prado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: make js html openapi version lint-security test
