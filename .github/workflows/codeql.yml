# CodeQL: static analysis of the JavaScript (the site, the builders of the data and the notifier), on each push to the main branch and
# once a week. The alerts are in the Security tab of the GitHub copy; nothing is blocked. It runs on GitHub only (GitLab ignores the file).
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    if: github.repository_owner == 'Antonio-Prado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
