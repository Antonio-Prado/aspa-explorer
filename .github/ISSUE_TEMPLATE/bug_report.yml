name: Bug report
description: Something on aspa.ping6.it does not work as it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. Please do not report a security problem here: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The page, the AS number or the path you typed, and what you pressed. A link to the result (the address in the browser, or a shared result `/r/...`) is the best.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Firefox 140 on Linux, or Safari on iPhone"
  - type: input
    id: version
    attributes:
      label: Version of the site
      description: In the footer of the page, after "Release".
      placeholder: "v1.38.3"
