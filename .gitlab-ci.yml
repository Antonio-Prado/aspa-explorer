stages:
  - lint

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

js-syntax:
  stage: lint
  image: node:22-alpine
  script:
    - node --check site/app.js

html-validate:
  stage: lint
  image: node:22-alpine
  script:
    - npx --yes html-validate@9 site/index.html

nginx-config:
  stage: lint
  image: nginx:stable-alpine
  before_script:
    # needed only in the Alpine image; shell runners already provide openssl
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache openssl; fi
  script:
    - sh scripts/check-nginx.sh
