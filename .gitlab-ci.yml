stages:
  - lint
  - security

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

js-syntax:
  stage: lint
  image: node:22-alpine
  script:
    - node --check site/app.js
    - node --check site/footer.js

html-validate:
  stage: lint
  image: node:22-alpine
  script:
    - npx --yes html-validate@9 site/index.html site/guide.html

nginx-config:
  stage: lint
  image: nginx:stable-alpine
  before_script:
    # needed only in the Alpine image; shell runners already provide openssl
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache openssl; fi
  script:
    - sh scripts/check-nginx.sh

version-consistency:
  stage: lint
  image: alpine:3
  script:
    - sh scripts/check-version.sh

# Security checks. GitLab's own SAST and Secret Detection need Docker runners and
# the dependency scanning is an Ultimate feature, so the equivalents run as plain
# commands (the images below are used by Docker runners; shell runners use the tools
# installed on the host: node and gitleaks).
js-security-lint:
  stage: security
  image: node:22-alpine
  script:
    - npx --yes eslint@9 --no-config-lookup -c eslint.config.mjs site/app.js site/footer.js

secret-detection:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --no-banner .
