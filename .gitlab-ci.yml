stages:
  - lint
  - security
  - publish

default:
  interruptible: true

# Scheduled pipelines only run the jobs of their own SCHEDULE (see the end of the file).
.regular:
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && $SCHEDULE == null

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

js-syntax:
  extends: .regular
  stage: lint
  image: node:22-alpine
  script:
    - node --check site/app.js
    - node --check site/footer.js
    - node --check site/verify.js
    - node --check site/history.js
    - node --check site/quality.js
    - node --check scripts/build-api.mjs
    - node --check scripts/build-adoption.mjs
    - for f in site/adoption.js site/stats.js site/download.js site/status.js site/examples.js site/subscription.js; do node --check "$f"; done
    - for f in notifier/*.mjs; do node --check "$f"; done

unit-tests:
  extends: .regular
  stage: lint
  image: node:22-alpine
  script:
    - node scripts/test-verify.mjs
    - node scripts/test-api.mjs
    - node scripts/test-adoption.mjs
    - node scripts/test-notify.mjs

html-validate:
  extends: .regular
  stage: lint
  image: node:22-alpine
  script:
    - npx --yes html-validate@9 site/index.html site/guide.html site/api.html site/subscription.html site/statistics.html site/status.html site/examples.html

nginx-config:
  extends: .regular
  stage: lint
  image: nginx:stable-alpine
  before_script:
    # needed only in the Alpine image; shell runners already provide openssl
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache openssl; fi
  script:
    - sh scripts/check-nginx.sh

version-consistency:
  extends: .regular
  stage: lint
  image: alpine:3
  script:
    - sh scripts/check-version.sh

# Security checks. GitLab's own SAST and Secret Detection need Docker runners and
# the dependency scanning is an Ultimate feature, so the equivalents run as plain
# commands (the images below are used by Docker runners; shell runners use the tools
# installed on the host: node and gitleaks).
js-security-lint:
  extends: .regular
  stage: security
  image: node:22-alpine
  script:
    - npx --yes eslint@9 --no-config-lookup -c eslint.config.mjs site/app.js site/footer.js site/verify.js site/history.js site/quality.js site/adoption.js site/stats.js site/download.js site/status.js site/examples.js site/subscription.js

secret-detection:
  extends: .regular
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --no-banner .

# Scheduled jobs. Pipeline schedules set the SCHEDULE variable; a pipeline started by
# hand (web or API) with the same variable runs the same job.

# Weekly: known vulnerabilities in the packages of the host that runs the runner (nginx,
# Node.js, the runner itself, the base system). Needs the runner of that host.
host-package-audit:
  stage: security
  tags: [aspa]
  # exit status 3: vulnerabilities that no package update fixes yet (a warning)
  allow_failure:
    exit_codes: 3
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCHEDULE == "audit"
  script:
    - sh scripts/pkg-audit.sh

# Daily: a snapshot of the ASPA data, logged as a run of the project's model experiment
# (Analyze > Model experiments) to chart the adoption of ASPA over time.
aspa-snapshot:
  stage: security
  tags: [aspa]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCHEDULE == "snapshot"
  script:
    - node scripts/log-snapshot.mjs

# Publication to the public mirror. The push mirror copies branches and tags; releases and
# the wiki are published through the API of the public project (MIRROR_TOKEN).
publish-release:
  stage: publish
  tags: [aspa]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - node scripts/publish-release.mjs

mirror-wiki:
  stage: publish
  tags: [aspa]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCHEDULE == "wiki"
  script:
    - sh scripts/mirror-wiki.sh
