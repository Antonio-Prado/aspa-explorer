stages:
  - lint
  - security
  - publish

default:
  interruptible: true

# Scheduled pipelines only run the jobs of their own SCHEDULE (see the end of the file).
.regular:
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && $SCHEDULE == null

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

js-syntax:
  extends: .regular
  stage: lint
  image: node:22-alpine
  script:
    - sh scripts/check-js.sh

unit-tests:
  extends: .regular
  stage: lint
  image: node:22-alpine
  script:
    - sh scripts/run-tests.sh

html-validate:
  extends: .regular
  stage: lint
  image: node:22-alpine
  script:
    - npx --yes html-validate@9 site/index.html site/guide.html site/api.html site/subscription.html site/statistics.html site/status.html site/examples.html site/embed.html site/report.html

nginx-config:
  extends: .regular
  stage: lint
  image: nginx:stable-alpine
  before_script:
    # needed only in the Alpine image; shell runners already provide openssl
    - if command -v apk >/dev/null 2>&1; then apk add --no-cache openssl; fi
  script:
    - sh scripts/check-nginx.sh

version-consistency:
  extends: .regular
  stage: lint
  image: alpine:3
  script:
    - sh scripts/check-version.sh

# Security checks. GitLab's own SAST and Secret Detection need Docker runners and
# the dependency scanning is an Ultimate feature, so the equivalents run as plain
# commands (the images below are used by Docker runners; shell runners use the tools
# installed on the host: node and gitleaks).
js-security-lint:
  extends: .regular
  stage: security
  image: node:22-alpine
  script:
    - npx --yes eslint@9 --no-config-lookup -c eslint.config.mjs site/*.js

secret-detection:
  extends: .regular
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --no-banner .

# Scheduled jobs. Pipeline schedules set the SCHEDULE variable; a pipeline started by
# hand (web or API) with the same variable runs the same job.

# Accessibility and layout of every page in a real browser (axe-core, light and dark, desktop and 320 px), on the runner of the
# host, where a Chromium is installed (FreeBSD has no Playwright browser: pkg install chromium). It also runs on GitHub on every
# push (.github/workflows/accessibility.yml, on the public copy). Without a Chromium it ends with status 3, a warning, and says so.
a11y:
  extends: .regular
  stage: lint
  tags: [aspa]
  allow_failure:
    exit_codes: 3
  script:
    - sh scripts/run-a11y.sh

# Weekly: known vulnerabilities in the packages of the host that runs the runner (nginx,
# Node.js, the runner itself, the base system). Needs the runner of that host.
host-package-audit:
  stage: security
  tags: [aspa]
  # exit status 3: vulnerabilities that no package update fixes yet (a warning)
  allow_failure:
    exit_codes: 3
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCHEDULE == "audit"
  script:
    - sh scripts/pkg-audit.sh

# Daily: a snapshot of the ASPA data, logged as a run of the project's model experiment
# (Analyze > Model experiments) to chart the adoption of ASPA over time.
aspa-snapshot:
  stage: security
  tags: [aspa]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCHEDULE == "snapshot"
  script:
    - node scripts/log-snapshot.mjs

# Hourly: the history branch only (the day's row and events, the Atom feed), so that the history of an AS
# shows an ASPA within the hour instead of the next morning. No model experiment run, no RIPEstat call; a
# run that finds nothing new commits nothing.
history-refresh:
  stage: security
  tags: [aspa]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCHEDULE == "history"
  script:
    - node scripts/log-snapshot.mjs --history-only

# Publication to the public mirror. The push mirror copies branches and tags; releases and
# the wiki are published through the API of the public project (MIRROR_TOKEN).
publish-release:
  stage: publish
  tags: [aspa]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - node scripts/publish-release.mjs

# Copy of the project on GitHub (read only, github.com/Antonio-Prado/aspa-explorer): the commit or the tag of the pipeline is
# pushed with a deploy key that can write to that repository only (the protected variable GITHUB_DEPLOY_KEY).
github-mirror:
  stage: publish
  tags: [aspa]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule" && $SCHEDULE == null
  script:
    - sh scripts/mirror-github.sh

mirror-wiki:
  stage: publish
  tags: [aspa]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCHEDULE == "wiki"
  script:
    - sh scripts/mirror-wiki.sh
