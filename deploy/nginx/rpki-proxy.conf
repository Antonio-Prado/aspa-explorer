# Forward to Routinator on rpki.ping6.it, with TLS verification and caching.
# Behind a proxy that does not forward this port, use a name that resolves straight to the validator
# in proxy_pass and keep proxy_ssl_name set to the name on its certificate.
proxy_pass https://rpki.ping6.it:8323;
proxy_ssl_server_name on;
proxy_ssl_name rpki.ping6.it;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
proxy_cache aspa;
# key built on the rewritten URI: client-supplied parameters cannot bypass the cache
proxy_cache_key $proxy_host$uri$is_args$args;
proxy_cache_valid 200 2m;
# A validator that fails or does not answer is not covered by an old copy any more: the request goes on to the second
# validator (@rpki_second in aspa.conf), and to the last copy of this one only when that fails too (@rpki_stale).
proxy_connect_timeout 5s;
proxy_cache_use_stale updating;
proxy_intercept_errors on;
recursive_error_pages on;
error_page 500 502 503 504 = @rpki_second;
proxy_cache_lock on;
proxy_cache_background_update on;
proxy_hide_header Access-Control-Allow-Origin;
