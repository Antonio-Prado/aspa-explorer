# Forward to Routinator on rpki.ping6.it, with TLS verification and caching.
proxy_pass https://rpki.ping6.it:8323;
proxy_ssl_server_name on;
proxy_ssl_name rpki.ping6.it;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
proxy_cache aspa;
# key built on the rewritten URI: client-supplied parameters cannot bypass the cache
proxy_cache_key $proxy_host$uri$is_args$args;
proxy_cache_valid 200 2m;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_lock on;
proxy_cache_background_update on;
proxy_hide_header Access-Control-Allow-Origin;
