# Security headers. Included in the server block and again in every location that
# sets its own add_header (nginx does not inherit add_header into such locations).
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://stat.ripe.net https://rest.db.ripe.net https://api.globalping.io https://atlas.ripe.net https://www.peeringdb.com wss://ris-live.ripe.net; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
