# ASPA Explorer: static page + data proxied from Routinator (rpki.ping6.it). Replace 192.0.2.10 with your public IP.
proxy_cache_path /var/cache/nginx/aspa levels=1 keys_zone=aspa:1m max_size=64m inactive=2h use_temp_path=off;

# Subscriptions to notifications: a few requests a minute per visitor.
limit_req_zone $binary_remote_addr zone=aspa_subs:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=aspa_reports:2m rate=120r/m;

# A valid 32-bit AS number in the address of the page, the API, the badge or the feed of one AS.
map $uri $as_in_range {
    default 0;
    "~^/(?:as/(?:AS)?|api/v1/as/|badge/AS|feed/AS)(?:[1-9][0-9]{0,8}|[1-3][0-9]{9}|4[01][0-9]{8}|42[0-8][0-9]{7}|429[0-3][0-9]{6}|4294[0-8][0-9]{5}|42949[0-5][0-9]{4}|429496[0-6][0-9]{3}|4294967[01][0-9]{2}|42949672[0-8][0-9]|429496729[0-5])(?:/|\.svg|\.atom)?$" 1;
}

# redirect http -> https
server {
    listen 192.0.2.10:80;
    server_name aspa.ping6.it;
    return 301 https://aspa.ping6.it$request_uri;
}

server {
    listen 192.0.2.10:443 ssl;
    listen 127.0.0.1:8080;          # local preview, e.g. through an SSH tunnel
    http2 on;
    server_name aspa.ping6.it;

    # TLS certificate (e.g. Let's Encrypt), installed into this directory
    ssl_certificate     /usr/local/etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /usr/local/etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;

    root /usr/local/www/aspa;
    index index.html;

    include /usr/local/etc/nginx/security-headers.conf;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_proxied any;

    location / {
        try_files $uri $uri/ =404;
    }

    # The web app manifest (the name and the icons when the page is added to a home screen): nginx does not know the extension.
    location = /manifest.webmanifest {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type application/manifest+json;
    }

    location = /data/aspas.json {
        rewrite ^ /jsonext?exclude=routeOrigins,routerKeys? break;
        include /usr/local/etc/nginx/rpki-proxy.conf;
    }

    # The visitor's own address, shown in the page footer.
    # Behind a reverse proxy, add set_real_ip_from / real_ip_header (see the wiki, Deployment) so that
    # this shows the visitor's address and not the proxy's.
    location = /client-ip {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"ip":"$remote_addr"}';
    }

    # The Atom feed of the recent changes, kept on the history branch of the public project and
    # served from here with the right media type (and a short cache, to spare GitLab).
    location = /changes.atom {
        include /usr/local/etc/nginx/security-headers.conf;
        proxy_pass https://gitlab.dei.unipd.it/api/v4/projects/5246/repository/files/changes.atom/raw?ref=history;
        proxy_ssl_server_name on;
        proxy_set_header Host gitlab.dei.unipd.it;
        proxy_set_header Accept-Encoding "";
        # GitLab sends the file as text with headers of its own: replace them with ours
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        add_header Content-Type "application/atom+xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=600" always;
        proxy_cache aspa;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # The page of one AS: the same page, which reads the AS number from the address.
    location ~ "^/as/(?:AS)?[0-9]{1,10}/?$" {
        if ($as_in_range = 0) { return 404; }
        rewrite ^ /index.html break;
    }

    # API, badge and feed of one AS: files built every few minutes by scripts/build-api.mjs into
    # /var/db/aspa-gen/current. An AS without any of them gets a generic answer, so every valid
    # AS number works (the badge says "none", the feed is empty, the JSON says no ASPA).
    location ~ "^/api/v1/as/(?<asn>[0-9]{1,10})$" {
        if ($as_in_range = 0) { return 404; }
        set $as_number $asn;
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
        root /var/db/aspa-gen/current;
        try_files /api/v1/as/$asn.json @as_api_none;
    }
    location @as_api_none {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
        return 200 '{"asn":"AS$as_number","number":$as_number,"aspa":{"published":false,"providers":[],"no_providers":false,"sources":[]},"provider_of":[],"seen_in_bgp":null,"quality":[],"history":[],"named_as_provider_history":[],"links":{"page":"https://aspa.ping6.it/as/AS$as_number","badge":"https://aspa.ping6.it/badge/AS$as_number.svg","feed":"https://aspa.ping6.it/feed/AS$as_number.atom"}}\n';
    }
    # The whole list of ASPAs, as JSON rows and as CSV (built with the per-AS files).
    location = /api/v1/aspas.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
        root /var/db/aspa-gen/current;
    }
    location = /api/v1/aspas.csv {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type text/csv;
        charset utf-8;
        charset_types text/csv;
        root /var/db/aspa-gen/current;
    }
    location = /api/v1/meta.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        root /var/db/aspa-gen/current;
    }
    location ~ "^/badge/AS(?<asn>[0-9]{1,10})\.svg$" {
        if ($as_in_range = 0) { return 404; }
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        root /var/db/aspa-gen/current;
        try_files /badge/AS$asn.svg /badge/none.svg;
    }
    location ~ "^/feed/AS(?<asn>[0-9]{1,10})\.atom$" {
        if ($as_in_range = 0) { return 404; }
        set $as_number $asn;
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        default_type application/atom+xml;
        root /var/db/aspa-gen/current;
        try_files /feed/AS$asn.atom @as_feed_none;
    }
    location @as_feed_none {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600" always;
        default_type application/atom+xml;
        return 200 '<?xml version="1.0" encoding="utf-8"?>\n<feed xmlns="http://www.w3.org/2005/Atom"><title>ASPA changes for AS$as_number</title><id>tag:aspa.ping6.it,2026:feed:AS$as_number</id><updated>$time_iso8601</updated><link rel="self" href="https://aspa.ping6.it/feed/AS$as_number.atom"/><link rel="alternate" href="https://aspa.ping6.it/as/AS$as_number"/></feed>\n';
    }

    # The page was called adoption.html before it also held the charts of the ASPAs.
    location = /adoption.html {
        return 301 /statistics.html;
    }

    # Who has an ASPA, by RIR, country and size: one file built once a day by scripts/build-adoption.mjs.
    location = /api/v1/adoption.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        alias /var/db/aspa-gen/adoption.json;
    }

    # The country and registry of the ASes seen in BGP (built with the adoption numbers).
    location = /api/v1/asn-registry.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        alias /var/db/aspa-gen/asn-registry.json;
    }

    # The monthly snapshots of the data (scripts/build-dataset.mjs): the archives and index.json.
    location /datasets/ {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        alias /var/db/aspa-gen/datasets/;
        autoindex off;
    }

    # From the allocation of an AS number to its ASPA (scripts/build-resources.mjs, daily) and the announcements that ASPA proves invalid,
    # as the route collectors receive them (scripts/watch-invalid.mjs, every ten minutes).
    location = /api/v1/resources.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        alias /var/db/aspa-gen/resources.json;
    }
    location = /api/v1/invalid.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
        alias /var/db/aspa-gen/invalid.json;
    }

    # The number of networks with an ASPA over time, by RIR and country, built once a day by scripts/build-trends.mjs.
    location = /api/v1/trends.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        alias /var/db/aspa-gen/trends.json;
    }

    # The chart of the trends, made to be framed by other sites: the same policy as the other pages, but any page may frame it.
    location = /embed.html {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # The state of each part of the service over time, extended every 15 minutes by scripts/build-status.mjs.
    location = /api/v1/status-history.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
        alias /var/db/aspa-gen/status-history.json;
    }

    # The tally of each month of the same checks, kept for good (the history above keeps 90 days).
    location = /api/v1/status-months.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=900" always;
        default_type application/json;
        alias /var/db/aspa-gen/status-months.json;
    }

    # The ASPAs of three validators side by side, built every hour by scripts/build-validators.mjs.
    location = /api/v1/validators.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=1800" always;
        default_type application/json;
        alias /var/db/aspa-gen/validators.json;
    }

    # Route leaks (valleys) in the routes of three RIS collectors, built once a day by scripts/build-leaks.mjs.
    location = /api/v1/leaks.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        alias /var/db/aspa-gen/leaks.json;
    }

    # The places of valley that involve each AS (today, and the last 60 days) and the daily totals of the leaks.
    location = /api/v1/leaks-by-as.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        alias /var/db/aspa-gen/leaks-by-as.json;
    }
    location = /api/v1/leaks-history.json {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        alias /var/db/aspa-gen/leaks-history.json;
    }
    location ~ "^/api/v1/leaks-by-as/(\d{8})\.json$" {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        alias /var/db/aspa-gen/leaks-days/$1.json;
    }

    # Subscriptions to notifications (e-mail, webhook): the notifier service on the loopback interface.
    location ^~ /api/v1/subscriptions {
        client_max_body_size 4k;
        limit_req zone=aspa_subs burst=10 nodelay;
        limit_req_status 429;
        include /usr/local/etc/nginx/security-headers.conf;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    # Shared results (reports): made by POST, read as JSON, and the page /r/<id> with the title of the report in its head; all by the notifier.
    location ^~ /api/v1/reports {
        client_max_body_size 230k;
        limit_req zone=aspa_reports burst=60 nodelay;
        limit_req_status 429;
        include /usr/local/etc/nginx/security-headers.conf;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }
    location ~ "^/r/[0-9a-f]{12}$" {
        limit_req zone=aspa_reports burst=60 nodelay;
        limit_req_status 429;
        include /usr/local/etc/nginx/security-headers.conf;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    # Origin validation of one route (ROA check) by Routinator, for the routes box of the page.
    location ~ "^/data/validity/(?<vasn>AS[0-9]{1,10})/(?<vprefix>[0-9a-fA-F:.]{2,45}/[0-9]{1,3})$" {
        rewrite ^ /api/v1/validity/$vasn/$vprefix? break;
        include /usr/local/etc/nginx/rpki-proxy.conf;
    }

    location = /data/status.json {
        rewrite ^ /api/v1/status? break;
        include /usr/local/etc/nginx/rpki-proxy.conf;
    }
}
