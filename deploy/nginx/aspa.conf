# ASPA Explorer: static page + data proxied from Routinator (rpki.ping6.it). Replace 192.0.2.10 with your public IP.
proxy_cache_path /var/cache/nginx/aspa levels=1 keys_zone=aspa:1m max_size=64m inactive=2h use_temp_path=off;

# redirect http -> https
server {
    listen 192.0.2.10:80;
    server_name aspa.ping6.it;
    return 301 https://aspa.ping6.it$request_uri;
}

server {
    listen 192.0.2.10:443 ssl;
    listen 127.0.0.1:8080;          # local preview, e.g. through an SSH tunnel
    http2 on;
    server_name aspa.ping6.it;

    # TLS certificate (e.g. Let's Encrypt), installed into this directory
    ssl_certificate     /usr/local/etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /usr/local/etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;

    root /usr/local/www/aspa;
    index index.html;

    include /usr/local/etc/nginx/security-headers.conf;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_proxied any;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /data/aspas.json {
        rewrite ^ /jsonext?exclude=routeOrigins,routerKeys? break;
        include /usr/local/etc/nginx/rpki-proxy.conf;
    }

    # The visitor's own address, shown in the page footer.
    location = /client-ip {
        include /usr/local/etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"ip":"$remote_addr"}';
    }

    location = /data/status.json {
        rewrite ^ /api/v1/status? break;
        include /usr/local/etc/nginx/rpki-proxy.conf;
    }
}
