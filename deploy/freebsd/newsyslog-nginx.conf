# Rotation of the logs of the web server: every day at midnight, compressed (J), 365 files kept, then deleted. They hold the address of every
# visitor, for the security and the running of the service; the privacy section of the guide says so. Install as
# /usr/local/etc/newsyslog.conf.d/aspa-nginx.conf; the signal 30 (USR1) makes nginx open its logs again.
# logfilename                 mode  count size when  flags  pid_file             sig
/var/log/nginx/access.log     644   365   *    @T00  JC     /var/run/nginx.pid   30
/var/log/nginx/error.log      644   365   *    @T00  JC     /var/run/nginx.pid   30
